name: Setup
description: Install pnpm, Node.js, and the workspace dependencies.
inputs:
  node-version:
    description: Node.js version
    default: '24'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
