name: Nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  canary:
    name: Next.js canary (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Next.js canary in the fixtures
        run: pnpm --filter './fixtures/*' add next@canary react@latest react-dom@latest
      - run: pnpm build
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:examples
      - run: pnpm test:e2e
      - run: pnpm test:e2e:native
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: nightly-playwright-traces
          path: test-results
          retention-days: 7

  bench-smoke:
    name: Benchmark harness smoke test (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm --filter bench-app build
      - run: pnpm --filter actionmcp-bench exec agent-browser install --with-deps
      - run: pnpm bench:smoke
